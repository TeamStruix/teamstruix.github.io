<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <!-- viewport-fit=cover 是全屏跑时拿到 env(safe-area-inset-*) 的前提 -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#F6F1E7" />
    <meta name="description" content="世博文化公园 · 狗Go乐园犬友护照" />

    <!-- iOS 基本不读 manifest，安装相关的东西得靠这几个 meta 单独声明 -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="狗Go护照" />
    <!-- black-translucent：内容伸到状态栏底下，真机才有沉浸感。
         代价是状态栏文字恒为白色（iOS 对 PWA 只给这一种），浅色界面上白字会看不见——
         由 styles.css 里的顶部墨色渐变纱补足可读性，深色沉浸屏（相机/登录/封面）
         则由 logic.syncChrome 挂 chrome-dark 类把纱收掉。
         另一个收益：设计里给假状态栏预留的 58px 页头留白，正好成为真状态栏的落位，
         真机上不再出现「真状态栏 + 58px 空白」的双重留白。
         注意：这个 meta 在「添加到主屏幕」那一刻定死，改完必须删掉重新添加才生效。 -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png" />

    <!-- 冷启动闪屏。iOS 按机型媒体查询静态匹配，一台设备只对应一张，没法每次启动轮换；
         这里是把几张源图轮流分配给不同机型。三个媒体条件缺一不可，写错就退回白屏。
         由 scripts/art.mjs splash 生成，别手改。 -->

    <link rel="apple-touch-startup-image" href="./splash/splash-375x667@2x.jpg"
      media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" />
    <!-- 8 Plus -->
    <link rel="apple-touch-startup-image" href="./splash/splash-414x736@3x.jpg"
      media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" />
    <!-- X/XS · 11 Pro · 12/13 mini -->
